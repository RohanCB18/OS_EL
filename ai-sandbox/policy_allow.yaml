# AI Sandbox Security Policy - ALLOW Demo
# This policy includes GitHub in whitelist to allow git operations

# Files/directories to hide from the sandbox
protected_files:
  - ~/.env
  - ~/.aws
  - ~/.gnupg
  - ~/.config/gh

# Network policy: DENY (whitelist only) or ALLOW (all)
default_network_policy: DENY

# Whitelisted domains/IPs - GitHub IS included
# This will allow git push/pull to work successfully
network_whitelist:
  - github.com
  - api.github.com
  - pypi.org
  - registry.npmjs.org

# Set to true to allow all HTTPS regardless of whitelist
allow_all_https: false
